<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Utilization Score Impact Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%); min-height: 100vh; }
  .card { background: rgba(255,255,255,0.97); }
  .util-green { background:#dcfce7; color:#16a34a; }
  .util-yellow { background:#fef9c3; color:#ca8a04; }
  .util-orange { background:#ffedd5; color:#ea580c; }
  .util-red { background:#fee2e2; color:#dc2626; }
  .bar-green { background:#22c55e; }
  .bar-yellow { background:#eab308; }
  .bar-orange { background:#f97316; }
  .bar-red { background:#ef4444; }
  .milestone { border-top: 2px dashed #a78bfa; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-3xl mx-auto">
  <div class="card rounded-2xl shadow-2xl p-6 mb-6">
    <h1 class="text-2xl font-bold text-indigo-800 mb-1">Credit Utilization Score Impact Simulator</h1>
    <p class="text-gray-500 text-sm mb-5">Add up to 5 credit cards and simulate paydown scenarios</p>

    <div id="cardsList" class="space-y-3 mb-4"></div>

    <button id="addCardBtn" onclick="addCard()"
      class="w-full border-2 border-dashed border-indigo-300 text-indigo-600 py-2 rounded-lg hover:bg-indigo-50 transition font-medium text-sm">
      + Add Credit Card
    </button>
  </div>

  <div id="results" class="hidden card rounded-2xl shadow-2xl p-6 mb-6">
    <h2 class="text-xl font-bold text-indigo-800 mb-4">Utilization Analysis</h2>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-indigo-50 rounded-xl p-4 text-center">
        <div class="text-xs text-indigo-500 font-medium uppercase mb-1">Overall Utilization</div>
        <div id="overallPct" class="text-3xl font-bold text-indigo-800"></div>
        <div id="overallBadge" class="mt-1"></div>
      </div>
      <div class="bg-purple-50 rounded-xl p-4 text-center">
        <div class="text-xs text-purple-500 font-medium uppercase mb-1">Total Credit Used</div>
        <div id="totalUsed" class="text-3xl font-bold text-purple-800"></div>
        <div class="text-xs text-gray-400" id="totalLimit"></div>
      </div>
    </div>

    <div id="cardBreakdown" class="space-y-3 mb-6"></div>

    <div class="milestone rounded-xl p-4 mb-6">
      <h3 class="font-bold text-indigo-700 mb-3">Milestone Targets</h3>
      <div id="milestones" class="space-y-2"></div>
    </div>

    <div class="bg-indigo-50 rounded-xl p-4 mb-6">
      <h3 class="font-bold text-indigo-700 mb-3">Simulate Paydown</h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1" for="simCard">Card</label>
          <select id="simCard" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1" for="simAmount">Pay Down ($)</label>
          <input id="simAmount" type="number" min="0" placeholder="e.g. 500"
            class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div class="flex items-end">
          <button onclick="simulate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-1.5 rounded-lg text-sm transition">Simulate</button>
        </div>
      </div>
      <div id="simResult" class="mt-3 hidden bg-white rounded-lg p-3 text-sm"></div>
    </div>

    <div>
      <h3 class="font-bold text-indigo-700 mb-3">Optimal Payoff Order (highest utilization first)</h3>
      <div id="payoffOrder" class="space-y-2"></div>
    </div>
  </div>
</div>

<script>
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let cards = [];
let cardIdCounter = 0;

const STORAGE_KEY = 'creditUtilSim';

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards, cardIdCounter }));
}

function load() {
  const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  if (d) { cards = d.cards || []; cardIdCounter = d.cardIdCounter || 0; }
  renderCardInputs();
}

function utilClass(pct) {
  if (pct < 10) return 'util-green';
  if (pct < 30) return 'util-yellow';
  if (pct < 50) return 'util-orange';
  return 'util-red';
}
function barClass(pct) {
  if (pct < 10) return 'bar-green';
  if (pct < 30) return 'bar-yellow';
  if (pct < 50) return 'bar-orange';
  return 'bar-red';
}
function utilLabel(pct) {
  if (pct < 10) return 'Excellent';
  if (pct < 30) return 'Good';
  if (pct < 50) return 'Fair';
  return 'High Risk';
}

function addCard() {
  if (cards.length >= 5) { alert('Maximum 5 cards allowed.'); return; }
  cardIdCounter++;
  cards.push({ id: cardIdCounter, name: '', balance: '', limit: '' });
  save();
  renderCardInputs();
}

function removeCard(id) {
  cards = cards.filter(c => c.id !== id);
  save();
  renderCardInputs();
  if (cards.length > 0) analyze();
  else document.getElementById('results').classList.add('hidden');
}

function updateCard(id, field, value) {
  const c = cards.find(c => c.id === id);
  if (c) { c[field] = value; save(); }
}

function renderCardInputs() {
  const container = document.getElementById('cardsList');
  container.innerHTML = '';
  cards.forEach(c => {
    const div = document.createElement('div');
    div.className = 'bg-gray-50 rounded-xl p-4 flex flex-wrap gap-3 items-end relative';
    div.innerHTML = `
      <div class="flex-1 min-w-32">
        <label class="block text-xs font-medium text-gray-600 mb-1" for="name_${escapeHtml(String(c.id))}">Card Name</label>
        <input id="name_${escapeHtml(String(c.id))}" type="text" value="${escapeHtml(c.name)}" placeholder="e.g. Chase Freedom"
          class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          oninput="updateCard(${c.id},'name',this.value);scheduleAnalyze()">
      </div>
      <div class="flex-1 min-w-28">
        <label class="block text-xs font-medium text-gray-600 mb-1" for="bal_${escapeHtml(String(c.id))}">Balance ($)</label>
        <input id="bal_${escapeHtml(String(c.id))}" type="number" min="0" value="${escapeHtml(String(c.balance))}" placeholder="0"
          class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          oninput="updateCard(${c.id},'balance',this.value);scheduleAnalyze()">
      </div>
      <div class="flex-1 min-w-28">
        <label class="block text-xs font-medium text-gray-600 mb-1" for="lim_${escapeHtml(String(c.id))}">Credit Limit ($)</label>
        <input id="lim_${escapeHtml(String(c.id))}" type="number" min="1" value="${escapeHtml(String(c.limit))}" placeholder="5000"
          class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          oninput="updateCard(${c.id},'limit',this.value);scheduleAnalyze()">
      </div>
      <button onclick="removeCard(${c.id})" aria-label="Remove card" class="text-gray-400 hover:text-red-500 text-xl px-1 pb-1 transition">×</button>`;
    container.appendChild(div);
  });

  const addBtn = document.getElementById('addCardBtn');
  addBtn.disabled = cards.length >= 5;
  addBtn.classList.toggle('opacity-40', cards.length >= 5);
}

let analyzeTimer = null;
function scheduleAnalyze() {
  clearTimeout(analyzeTimer);
  analyzeTimer = setTimeout(analyze, 300);
}

function analyze() {
  const valid = cards.filter(c => parseFloat(c.limit) > 0 && parseFloat(c.balance) >= 0);
  if (valid.length === 0) { document.getElementById('results').classList.add('hidden'); return; }

  let totalBal = 0, totalLim = 0;
  valid.forEach(c => { totalBal += parseFloat(c.balance) || 0; totalLim += parseFloat(c.limit) || 0; });
  const overallPct = totalLim > 0 ? (totalBal / totalLim * 100) : 0;

  document.getElementById('overallPct').textContent = overallPct.toFixed(1) + '%';
  document.getElementById('totalUsed').textContent = '$' + totalBal.toLocaleString();
  document.getElementById('totalLimit').textContent = 'of $' + totalLim.toLocaleString() + ' limit';

  const ob = document.getElementById('overallBadge');
  ob.innerHTML = `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${utilClass(overallPct)}">${escapeHtml(utilLabel(overallPct))}</span>`;

  let breakdown = '';
  valid.forEach(c => {
    const bal = parseFloat(c.balance) || 0;
    const lim = parseFloat(c.limit) || 1;
    const pct = bal / lim * 100;
    const barW = Math.min(100, pct).toFixed(1);
    const name = c.name || 'Card';
    breakdown += `<div class="bg-gray-50 rounded-xl p-3">
      <div class="flex justify-between items-center mb-1">
        <span class="font-medium text-gray-700 text-sm">${escapeHtml(name)}</span>
        <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${utilClass(pct)}">${pct.toFixed(1)}%</span>
      </div>
      <div class="flex justify-between text-xs text-gray-400 mb-1.5">
        <span>$${bal.toLocaleString()} / $${lim.toLocaleString()}</span>
      </div>
      <div class="bg-gray-200 rounded-full h-2">
        <div class="${barClass(pct)} h-2 rounded-full transition-all" style="width:${barW}%"></div>
      </div>
    </div>`;
  });
  document.getElementById('cardBreakdown').innerHTML = breakdown;

  const m30 = totalLim * 0.30;
  const m10 = totalLim * 0.10;
  const to30 = Math.max(0, totalBal - m30);
  const to10 = Math.max(0, totalBal - m10);
  let ms = '';
  ms += `<div class="flex justify-between items-center text-sm p-2 rounded-lg ${overallPct <= 30 ? 'bg-green-50' : 'bg-yellow-50'}">
    <span class="text-gray-600">30% milestone (Good range)</span>
    <span class="font-semibold ${overallPct <= 30 ? 'text-green-600' : 'text-yellow-600'}">
      ${overallPct <= 30 ? '✓ Achieved' : `Pay down $${to30.toFixed(0)}`}
    </span>
  </div>`;
  ms += `<div class="flex justify-between items-center text-sm p-2 rounded-lg ${overallPct <= 10 ? 'bg-green-50' : 'bg-orange-50'}">
    <span class="text-gray-600">10% milestone (Excellent range)</span>
    <span class="font-semibold ${overallPct <= 10 ? 'text-green-600' : 'text-orange-600'}">
      ${overallPct <= 10 ? '✓ Achieved' : `Pay down $${to10.toFixed(0)}`}
    </span>
  </div>`;
  document.getElementById('milestones').innerHTML = ms;

  const sorted = [...valid].sort((a, b) => {
    const pa = (parseFloat(a.balance)||0) / (parseFloat(a.limit)||1);
    const pb = (parseFloat(b.balance)||0) / (parseFloat(b.limit)||1);
    return pb - pa;
  });
  let po = '';
  sorted.forEach((c, i) => {
    const bal = parseFloat(c.balance) || 0;
    const lim = parseFloat(c.limit) || 1;
    const pct = bal / lim * 100;
    po += `<div class="flex items-center gap-3 text-sm p-2 bg-gray-50 rounded-lg">
      <span class="font-bold text-indigo-400 w-4">${i + 1}</span>
      <span class="flex-1 font-medium text-gray-700">${escapeHtml(c.name || 'Card')}</span>
      <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${utilClass(pct)}">${pct.toFixed(1)}%</span>
      <span class="text-gray-400">$${bal.toLocaleString()}</span>
    </div>`;
  });
  document.getElementById('payoffOrder').innerHTML = po;

  const sel = document.getElementById('simCard');
  const prev = sel.value;
  sel.innerHTML = '';
  valid.forEach(c => {
    const opt = document.createElement('option');
    opt.value = String(c.id);
    opt.textContent = c.name || 'Card ' + c.id;
    sel.appendChild(opt);
  });
  if (prev && valid.find(c => String(c.id) === prev)) sel.value = prev;

  document.getElementById('results').classList.remove('hidden');
}

function simulate() {
  const cardId = parseInt(document.getElementById('simCard').value);
  const amount = parseFloat(document.getElementById('simAmount').value) || 0;
  const c = cards.find(x => x.id === cardId);
  if (!c) return;

  const bal = parseFloat(c.balance) || 0;
  const lim = parseFloat(c.limit) || 1;
  const newBal = Math.max(0, bal - amount);
  const newPct = newPct_val(newBal, lim);
  const oldPct = bal / lim * 100;

  const valid = cards.filter(x => parseFloat(x.limit) > 0 && parseFloat(x.balance) >= 0);
  let totalBal = 0, totalLim = 0;
  valid.forEach(x => { totalBal += parseFloat(x.balance) || 0; totalLim += parseFloat(x.limit) || 0; });
  const newOverall = totalLim > 0 ? (totalBal - amount + (newBal - bal < 0 ? 0 : 0)) / totalLim * 100 : 0;
  const adjustedNewOverall = totalLim > 0 ? (totalBal - Math.min(amount, bal)) / totalLim * 100 : 0;

  const div = document.getElementById('simResult');
  div.innerHTML = `<div class="space-y-1">
    <div class="flex justify-between"><span class="text-gray-500">${escapeHtml(c.name || 'Card')} utilization:</span>
      <span><span class="px-1.5 py-0.5 rounded ${utilClass(oldPct)} text-xs">${oldPct.toFixed(1)}%</span>
      → <span class="px-1.5 py-0.5 rounded ${utilClass(newPct)} text-xs">${newPct.toFixed(1)}%</span></span></div>
    <div class="flex justify-between"><span class="text-gray-500">Overall utilization:</span>
      <span class="font-semibold ${adjustedNewOverall <= 10 ? 'text-green-600' : adjustedNewOverall <= 30 ? 'text-yellow-600' : 'text-red-600'}">${adjustedNewOverall.toFixed(1)}%</span></div>
    <div class="flex justify-between"><span class="text-gray-500">New balance:</span>
      <span class="font-semibold text-indigo-700">$${newBal.toLocaleString()}</span></div>
  </div>`;
  div.classList.remove('hidden');
}

function newPct_val(bal, lim) { return lim > 0 ? bal / lim * 100 : 0; }

load();
if (cards.length === 0) addCard();
else { renderCardInputs(); analyze(); }
</script>
</body>
</html>
